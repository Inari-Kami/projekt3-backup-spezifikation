<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box   { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
    .exist { fill:#eef2f6; stroke:#333333; stroke-width:1.5; }
    .new   { fill:#ffffff; stroke:#333333; stroke-width:1.5; stroke-dasharray:6 3; }
    .repo  { fill:#e8efe8; stroke:#333333; stroke-width:2; }
    .group { fill:none; stroke:#999999; stroke-width:1; stroke-dasharray:4 4; }
    .t     { font-size:14px; fill:#111111; font-weight:bold; }
    .s     { font-size:11.5px; fill:#444444; }
    .lbl   { font-size:11px; fill:#333333; }
    .cap   { font-size:12px; fill:#666666; }
    .flow  { stroke:#333333; stroke-width:1.8; fill:none; }
    .cfg   { stroke:#666666; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
    .rest  { stroke:#666666; stroke-width:1.5; fill:none; stroke-dasharray:2 3; }
  </style>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333333"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <text x="20" y="28" class="t" font-size="16">Architektur: verteiltes Sicherungssystem</text>

  <!-- Control node -->
  <rect x="20" y="240" width="160" height="76" rx="4" class="box"/>
  <text x="100" y="268" class="t" text-anchor="middle">ctrl</text>
  <text x="100" y="286" class="s" text-anchor="middle">Ansible Control Node</text>
  <text x="100" y="302" class="s" text-anchor="middle">Inventar, Playbooks</text>

  <!-- Clients group -->
  <rect x="260" y="60" width="270" height="450" rx="6" class="group"/>
  <text x="395" y="82" class="cap" text-anchor="middle">Sicherungsquellen (Clients)</text>

  <rect x="280" y="96" width="230" height="82" rx="4" class="exist"/>
  <text x="395" y="120" class="t" text-anchor="middle">node-app</text>
  <text x="395" y="138" class="s" text-anchor="middle">bestehend · Ubuntu 24.04 · .20.10</text>
  <text x="395" y="155" class="s" text-anchor="middle">Spielstände, Konfiguration,</text>
  <text x="395" y="170" class="s" text-anchor="middle">systemd-Units</text>

  <rect x="280" y="194" width="230" height="66" rx="4" class="exist"/>
  <text x="395" y="218" class="t" text-anchor="middle">node-media</text>
  <text x="395" y="236" class="s" text-anchor="middle">bestehend · Jellyfin · .20.20</text>
  <text x="395" y="252" class="s" text-anchor="middle">Konfiguration und Metadaten</text>

  <rect x="280" y="276" width="230" height="66" rx="4" class="new"/>
  <text x="395" y="300" class="t" text-anchor="middle">node-db</text>
  <text x="395" y="318" class="s" text-anchor="middle">neu · Debian 13 (VM)</text>
  <text x="395" y="334" class="s" text-anchor="middle">PostgreSQL</text>

  <rect x="280" y="358" width="230" height="66" rx="4" class="new"/>
  <text x="395" y="382" class="t" text-anchor="middle">node-ctr</text>
  <text x="395" y="400" class="s" text-anchor="middle">neu · Debian 13 (VM)</text>
  <text x="395" y="416" class="s" text-anchor="middle">Container-Volumes</text>

  <rect x="280" y="440" width="230" height="52" rx="4" class="new"/>
  <text x="395" y="462" class="t" text-anchor="middle">node-verify</text>
  <text x="395" y="480" class="s" text-anchor="middle">neu · Prüfziel für Rückspieltests</text>

  <!-- Repo -->
  <rect x="610" y="200" width="230" height="96" rx="4" class="repo"/>
  <text x="725" y="226" class="t" text-anchor="middle">bak-repo</text>
  <text x="725" y="244" class="s" text-anchor="middle">Debian 13 · Borg-Repository</text>
  <text x="725" y="260" class="s" text-anchor="middle">append-only, eigener Datenträger</text>
  <text x="725" y="276" class="s" text-anchor="middle">Rotation (prune) läuft hier</text>

  <rect x="610" y="382" width="230" height="66" rx="4" class="new"/>
  <text x="725" y="406" class="t" text-anchor="middle">offsite</text>
  <text x="725" y="424" class="s" text-anchor="middle">Cloud-Knoten, anderer Standort</text>
  <text x="725" y="440" class="s" text-anchor="middle">Zweitkopie des Bestandes</text>

  <!-- ctrl -> clients -->
  <path d="M180 278 L 258 278" class="cfg" marker-end="url(#b)"/>
  <text x="219" y="268" class="lbl" text-anchor="middle">SSH</text>
  <text x="219" y="298" class="lbl" text-anchor="middle">Rollout</text>

  <!-- clients -> repo -->
  <path d="M510 137 C 570 137, 560 220, 608 226" class="flow" marker-end="url(#a)"/>
  <path d="M510 227 C 560 227, 570 238, 608 240" class="flow" marker-end="url(#a)"/>
  <path d="M510 309 C 560 309, 570 262, 608 258" class="flow" marker-end="url(#a)"/>
  <path d="M510 391 C 570 391, 560 285, 608 274" class="flow" marker-end="url(#a)"/>
  <text x="566" y="102" class="lbl" text-anchor="middle">verschlüsselter</text>
  <text x="566" y="117" class="lbl" text-anchor="middle">Sicherungsstrom</text>

  <!-- repo -> verify (restore) -->
  <path d="M660 296 C 640 380, 560 466, 512 466" class="rest" marker-end="url(#b)"/>
  <text x="600" y="360" class="lbl" text-anchor="middle">Rückspielung</text>

  <!-- repo -> offsite -->
  <path d="M790 296 L 790 380" class="cfg" marker-end="url(#b)"/>
  <text x="800" y="342" class="lbl">Replikation</text>

  <!-- Legend -->
  <rect x="20" y="452" width="200" height="88" rx="4" fill="none" stroke="#cccccc"/>
  <text x="32" y="472" class="cap">Legende</text>
  <rect x="32" y="482" width="18" height="12" class="exist"/>
  <text x="58" y="492" class="lbl">bestehender Host</text>
  <rect x="32" y="502" width="18" height="12" class="new"/>
  <text x="58" y="512" class="lbl">im Projekt zu erstellen</text>
  <rect x="32" y="522" width="18" height="12" class="repo"/>
  <text x="58" y="532" class="lbl">Repository</text>
</svg>
